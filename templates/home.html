<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>California House Price Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a202c;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .btn-submit {
            grid-column: span 2;
            margin-top: 10px;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #2b6cb0;
        }

        .result-box {
            margin-top: 24px;
            padding: 15px;
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            border-radius: 6px;
            text-align: center;
        }

        .result-box h3 {
            color: #2b6cb0;
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>California House Price Prediction</h1>
        
        <form action="{{ url_for('predict') }}" method="post" class="form-grid">
            <div class="form-group">
                <label for="MedInc">Median Income</label>
                <input type="number" step="any" id="MedInc" name="MedInc" placeholder="e.g. 8.32" required />
            </div>

            <div class="form-group">
                <label for="HouseAge">House Age</label>
                <input type="number" step="any" id="HouseAge" name="HouseAge" placeholder="e.g. 41" required />
            </div>

            <div class="form-group">
                <label for="AveRooms">Average Rooms</label>
                <input type="number" step="any" id="AveRooms" name="AveRooms" placeholder="e.g. 6.98" required />
            </div>

            <div class="form-group">
                <label for="AveBedrms">Average Bedrooms</label>
                <input type="number" step="any" id="AveBedrms" name="AveBedrms" placeholder="e.g. 1.02" required />
            </div>

            <div class="form-group">
                <label for="Population">Population</label>
                <input type="number" step="any" id="Population" name="Population" placeholder="e.g. 322" required />
            </div>

            <div class="form-group">
                <label for="AveOccup">Average Occupancy</label>
                <input type="number" step="any" id="AveOccup" name="AveOccup" placeholder="e.g. 2.55" required />
            </div>

            <div class="form-group">
                <label for="Latitude">Latitude</label>
                <input type="number" step="any" id="Latitude" name="Latitude" placeholder="e.g. 37.88" required />
            </div>

            <div class="form-group">
                <label for="Longitude">Longitude</label>
                <input type="number" step="any" id="Longitude" name="Longitude" placeholder="e.g. -122.23" required />
            </div>

            <button type="submit" class="btn-submit">Predict Price</button>
        </form>

        {% if prediction_text %}
        <div class="result-box">
            <h3>{{ prediction_text }}</h3>
        </div>
        {% endif %}
    </div>

</body>
</html>
